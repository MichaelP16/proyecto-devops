<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas DevOps — ITLA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>Lista de tareas</h1>
      <p class="subtitulo">Proyecto Final · Electiva 1: Introducción a DevOps · ITLA</p>
    </header>

    <form id="formulario" class="formulario" autocomplete="off">
      <input id="titulo" name="titulo" placeholder="¿Qué hay que hacer?" maxlength="120" required aria-label="Nueva tarea">
      <button type="submit">Agregar</button>
    </form>
    <p id="mensaje" class="mensaje" role="alert" hidden></p>

    <p id="resumen" class="resumen"></p>
    <ul id="lista" class="lista"></ul>
    <p id="vacio" class="vacio" hidden>No hay tareas todavía. ¡Agrega la primera!</p>

    <footer>
      <span id="estado" class="estado">Comprobando servidor…</span>
      <span id="version" class="version"></span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
