# Alertmanager agrupa las alertas de Prometheus y decide a quién notificar.
route:
  receiver: equipo-devops
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: equipo-devops
    # Para recibir notificaciones reales, descomenta y coloca tu webhook (Discord, Slack, Teams...):
    # webhook_configs:
    #   - url: "https://tu-servicio/webhook"
    #     send_resolved: true
